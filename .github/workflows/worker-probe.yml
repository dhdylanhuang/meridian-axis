name: Worker probe validator

on:
  push:
    paths:
      - 'prototype/worker-feasibility/**'
      - '.github/workflows/worker-probe.yml'
  pull_request:
    paths:
      - 'prototype/worker-feasibility/**'
      - '.github/workflows/worker-probe.yml'

permissions:
  contents: read

jobs:
  validator:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototype/worker-feasibility
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check synthetic validation with an isolated loopback server
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Check synthetic gateway routing and request isolation
        run: node --test tests/test_probe_gateway.mjs
