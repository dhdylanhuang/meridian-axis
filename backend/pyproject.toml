[project]
name = "great-dyke-meridian"
version = "0.1.0"
description = "Private, read-only portfolio monitoring"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pg8000>=1.31,<2",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
meridian = "meridian.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires an explicitly configured disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
